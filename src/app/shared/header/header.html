<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" routerLink="/" (click)="close()">
      <img src="/images/logo-mark.png" width="42" height="42" alt="" />
      <span class="brand__text">
        <span class="brand__name">{{ site.name }}</span>
        <span class="brand__place">Ahmedabad · Gandhinagar</span>
      </span>
    </a>

    <nav class="nav-desktop" aria-label="Primary">
      @for (link of nav; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
      }
    </nav>

    <div class="header-ctas">
      <a class="btn btn-terracotta" [href]="tel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M6.6 4h2.2l1.2 3-1.6 1.6a14 14 0 0 0 6.4 6.4L16.2 14l3 1.2v2.2c0 .7-.6 1.3-1.3 1.2C9.6 17.6 4 12 3.2 5.3 3.1 4.6 3.9 4 4.6 4Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
        <span class="btn-label">Call</span>
      </a>
      <a class="btn btn-whatsapp" [href]="wa" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M19.05 4.91A9.82 9.82 0 0 0 12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.06 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.92-7.01zm-7.01 15.24h-.01c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.26 8.26 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c.02 4.54-3.68 8.23-8.22 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.35-.76-1.84-.2-.48-.41-.42-.56-.42h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.07-.11-.22-.16-.47-.28z"
          />
        </svg>
        <span class="btn-label">WhatsApp</span>
      </a>
      <button
        class="menu-toggle"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-nav"
        (click)="toggle()"
      >
        <span class="sr-only">Menu</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          @if (menuOpen()) {
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" />
          } @else {
            <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" />
          }
        </svg>
      </button>
    </div>
  </div>

  <nav
    class="nav-mobile"
    id="mobile-nav"
    [class.open]="menuOpen()"
    aria-label="Mobile"
  >
    <div class="wrap">
      @for (link of nav; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active" (click)="close()">{{ link.label }}</a>
      }
    </div>
  </nav>
</header>
